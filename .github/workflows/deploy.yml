name: Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ric-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ADMIN_URL=${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          shm-size: 2g

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          command_timeout: 300s
          script: |
            cd ${{ secrets.PROJECT_PATH || '~/ric-landing' }}

            echo "🔄 Starting landing page deployment..."

            # Pull git changes
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Set environment variables
            export IMAGE_TAG=${{ github.ref_name }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest image
            echo "⬇️  Pulling latest image..."
            docker-compose -f docker-compose.prod.yml pull landing

            # Stop old container
            echo "🛑 Stopping old container..."
            docker-compose -f docker-compose.prod.yml stop landing
            docker-compose -f docker-compose.prod.yml rm -f landing

            # Start new container
            echo "🚀 Starting new container..."
            docker-compose -f docker-compose.prod.yml up -d landing

            # Wait for startup
            sleep 5

            # Verify deployment
            if docker ps | grep -q ric_landing; then
              echo "✅ Landing page deployment successful!"
            else
              echo "❌ Deployment failed!"
              docker-compose -f docker-compose.prod.yml logs landing --tail=30
              exit 1
            fi

            # Cleanup old images
            docker image prune -f

            echo "🎉 Landing page deployment completed!"
