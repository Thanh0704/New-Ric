services:
  # ===========================================
  # Landing Page - Next.js Static Site
  # ===========================================
  landing:
    image: ${DOCKER_USERNAME}/ric-landing:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: ${CONTAINER_NAME_LANDING:-ric_landing}
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - 3000
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    networks:
      - ric_network

networks:
  ric_network:
    external: true
    name: ${NETWORK_NAME:-ric_network}
